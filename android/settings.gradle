pluginManagement {
    def flutterSdkPath = System.getenv("FLUTTER_ROOT")

    if (flutterSdkPath == null) {
        def properties = new Properties()
        def localPropertiesFile = file("local.properties")

        if (localPropertiesFile.exists()) {
            localPropertiesFile.withInputStream {
                properties.load(it)
            }
            flutterSdkPath = properties.getProperty("flutter.sdk")
        }
    }

    assert flutterSdkPath != null :
        "Flutter SDK not found. FLUTTER_ROOT is not set."

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.7.3" apply false
    id "org.jetbrains.kotlin.android" version "2.1.0" apply false
}

include ":app"
